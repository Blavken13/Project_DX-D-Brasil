name: durango-brasil-staging

services:
  durango-server:
    build:
      context: ../../Durango-CustomServer/server
      dockerfile: Dockerfile

    image: durango-brasil-server:${DURANGO_IMAGE_TAG:-staging}
    container_name: durango-brasil-staging

    restart: unless-stopped
    init: true

    environment:
      DURANGO_ADMIN_CONFIG_DIR: /app/AppData-nx/admin-config
      DURANGO_REPORTS_TRUSTED_PROXY: 172.29.91.2

    networks:
      default: {}
      reports:
        ipv4_address: 172.29.91.3

    ports:
      - "${DURANGO_GATEWAY_PORT:-8190}:8190/tcp"
      - "${DURANGO_GAME_PORT:-8191}:8191/tcp"

    volumes:
      - durango-staging-state:/app/AppData-nx
      - ../../Durango-CustomServer/server/assetbundles/android:/app/assetbundles/android:ro

    command:
      - "--name"
      - "${DURANGO_CLUSTER_NAME}"
      - "--storage-key"
      - "${DURANGO_STORAGE_KEY:-Durango Brasil}"
      - "--data"
      - "/app/data"
      - "--terrains"
      - "/app/data/terrains"
      - "--assetbundles-android"
      - "/app/assetbundles/android"
      - "--public-host"
      - "${DURANGO_PUBLIC_HOST}"
      - "--max-players"
      - "${DURANGO_MAX_PLAYERS:-20}"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://127.0.0.1:8190/status >/dev/null || exit 1"
        ]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 30s

    stop_grace_period: 45s

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  reports-proxy:
    image: caddy:2.11.4-alpine
    container_name: durango-brasil-reports
    restart: unless-stopped
    environment:
      DURANGO_PUBLIC_HOST: ${DURANGO_PUBLIC_HOST}
    ports:
      - "80:80/tcp"
      - "443:443/tcp"
    networks:
      reports:
        ipv4_address: 172.29.91.2
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - reports-tls:/data
      - reports-config:/config
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

networks:
  reports:
    name: durango-brasil-reports
    ipam:
      config:
        - subnet: 172.29.91.0/24

volumes:
  reports-tls:
    name: durango-brasil-reports-tls
  reports-config:
    name: durango-brasil-reports-config
  durango-staging-state:
    name: durango-brasil-staging-state
